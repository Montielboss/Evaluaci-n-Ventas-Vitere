<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Evaluaciones - Punto de Venta</title>
<meta name="theme-color" content="#0a111f">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .doc{
    background:transparent;
    border:none;
    box-shadow:none;
    padding:0;
    border-radius:0;
    max-width:1120px;
    width:100%;
  }
  body{ padding-right:88px; align-items:flex-start; }

  .panel-top{ display:flex; flex-direction:column; align-items:center; gap:16px; margin-bottom:10px; padding-top:8px; }
  .panel-stats-line{ display:flex; gap:40px; align-items:baseline; flex-wrap:wrap; justify-content:center; }
  .panel-stats-line .stat{ display:flex; flex-direction:column; align-items:center; }
  .panel-stats-line .stat .n{ font-size:22px; font-weight:800; color:var(--ink); }
  .panel-stats-line .stat .l{ font-size:11px; color:var(--slate); text-transform:uppercase; letter-spacing:0.07em; font-weight:600; margin-top:2px; }

  .panel-search-wrap{ width:100%; max-width:360px; overflow:hidden; max-height:0; transition:max-height 0.2s ease; }
  .panel-search-wrap.open{ max-height:60px; }

  .results-count{ text-align:center; margin-bottom:14px; }

  .panel-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:16px;
  }
  .panel-card{
    background:linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 12px 18px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    cursor:pointer;
    transition:border-color 0.15s ease;
  }
  .panel-card:hover{ border-color:rgba(34,211,238,0.4); }
  .panel-seal{
    width:62px; height:62px; border-radius:50%; border:2px solid;
    display:flex; align-items:center; justify-content:center; margin-bottom:12px; flex-shrink:0;
  }
  .panel-seal.pass{ border-color:var(--ok); background:rgba(74,222,128,0.08); }
  .panel-seal.fail{ border-color:var(--bad); background:rgba(248,113,113,0.08); }
  .panel-seal .pct{ font-size:15px; font-weight:800; color:var(--ink); }
  .panel-card .top-line{ font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:4px; line-height:1.3; }
  .panel-card .sub-line{ font-size:11px; color:var(--slate); line-height:1.4; }

  .side-toolbar{
    position:fixed; top:0; right:0; bottom:0; width:60px;
    background:var(--surface); border-left:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center;
    padding-top:22px; gap:14px; z-index:10;
  }
  .side-toolbar button{
    width:40px; height:40px; border-radius:12px;
    background:transparent; border:1.5px solid var(--line); color:var(--slate);
    font-size:17px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; transition:border-color 0.15s ease, color 0.15s ease;
  }
  .side-toolbar button:hover{ border-color:rgba(34,211,238,0.45); color:var(--ink); }
</style>
</head>
<body>

<div class="doc">
  <main id="main"></main>
</div>

<div class="side-toolbar">
  <button id="sideThemeBtn" title="Cambiar tema">🌙</button>
  <button id="sideRefreshBtn" title="Actualizar">🔄</button>
  <button id="sideSearchBtn" title="Buscar">🔍</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="panel.js"></script>

</body>
</html>
