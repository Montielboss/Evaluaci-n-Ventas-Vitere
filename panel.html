<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Evaluaciones - Punto de Venta</title>
<meta name="theme-color" content="#0a111f">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .doc{
    background:transparent;
    border:none;
    box-shadow:none;
    padding:0;
    border-radius:0;
    max-width:1120px;
    width:100%;
  }
  body{ padding-right:88px; padding-top:74px; align-items:flex-start; }

  .panel-back-btn{
    position:fixed; top:20px; left:20px; z-index:10;
    background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px;
    padding:10px 16px; color:var(--ink); font-size:13px; font-weight:700;
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; transition:border-color 0.15s ease;
  }
  .panel-back-btn:hover{ border-color:rgba(34,211,238,0.45); }

  .panel-top{ display:flex; flex-direction:column; align-items:center; gap:16px; margin-bottom:10px; padding-top:8px; }
  .panel-stats-line{ display:flex; gap:40px; align-items:baseline; flex-wrap:wrap; justify-content:center; }
  .panel-stats-line .stat{ display:flex; flex-direction:column; align-items:center; }
  .panel-stats-line .stat .n{ font-size:22px; font-weight:800; color:var(--ink); }
  .panel-stats-line .stat .l{ font-size:11px; color:var(--slate); text-transform:uppercase; letter-spacing:0.07em; font-weight:600; margin-top:2px; }

  .panel-search-wrap{ width:100%; max-width:360px; overflow:hidden; max-height:0; transition:max-height 0.2s ease; }
  .panel-search-wrap.open{ max-height:60px; }

  .results-count{ text-align:center; margin-bottom:14px; }

  .panel-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
    gap:44px 16px;
    margin-top:30px;
  }
  .panel-card{
    background:linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
    border:1px solid var(--line);
    border-radius:16px;
    padding:40px 12px 18px;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    cursor:pointer;
    position:relative;
    transition:border-color 0.15s ease;
  }
  .panel-card:hover{ border-color:rgba(34,211,238,0.4); }
  .gauge-svg{
    position:absolute; top:0; left:50%;
    transform:translate(-50%, -50%);
    width:104px; height:56px;
  }
  .gauge-bg{ fill:none; stroke:var(--line); stroke-width:11; stroke-linecap:round; }
  .gauge-fill{ fill:none; stroke-width:11; stroke-linecap:round; transition:stroke-dashoffset 0.5s ease; }
  .gauge-fill.pass{ stroke:var(--ok); }
  .gauge-fill.fail{ stroke:var(--bad); }
  .panel-card .top-line{ font-size:16px; font-weight:800; color:var(--ink); margin-bottom:6px; line-height:1.3; }
  .panel-card .sub-line{ font-size:12.5px; color:var(--slate); line-height:1.5; }

  .side-toolbar{
    position:fixed; top:0; right:0; bottom:0; width:60px;
    background:var(--surface); border-left:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center;
    padding-top:22px; gap:14px; z-index:10;
  }
  .side-toolbar button{
    width:40px; height:40px; border-radius:12px;
    background:transparent; border:1.5px solid var(--line); color:var(--slate);
    font-size:17px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; transition:border-color 0.15s ease, color 0.15s ease;
  }
  .side-toolbar button:hover{ border-color:rgba(34,211,238,0.45); color:var(--ink); }
</style>
</head>
<body>

<div class="doc">
  <main id="main"></main>
</div>

<button class="panel-back-btn" id="panelBackBtn" title="Volver a la app">← Volver</button>

<div class="side-toolbar">
  <button id="sideThemeBtn" title="Cambiar tema">🌙</button>
  <button id="sideRefreshBtn" title="Actualizar">🔄</button>
  <button id="sideSearchBtn" title="Buscar">🔍</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="panel.js"></script>

</body>
</html>
