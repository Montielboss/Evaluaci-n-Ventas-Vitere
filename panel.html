<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Evaluaciones - Punto de Venta</title>
<meta name="theme-color" content="#0a111f">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .doc{
    background:transparent;
    border:none;
    box-shadow:none;
    padding:0;
    border-radius:0;
    max-width:640px;
  }
  .panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding-right:44px; }
  .panel-header h1{ font-size:24px; font-weight:800; margin:0; color:var(--ink); letter-spacing:-0.01em; }
  .panel-refresh{ background:transparent; border:none; color:var(--slate); font-size:15px; padding:8px; cursor:pointer; }
  .panel-refresh:hover{ color:var(--ink); }

  .panel-stats-vertical{ display:flex; flex-direction:column; margin-bottom:26px; }
  .panel-stat-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:12px 0; border-bottom:1px solid var(--line-soft);
  }
  .panel-stat-row .l{ font-size:12.5px; color:var(--slate); text-transform:uppercase; letter-spacing:0.07em; font-weight:600; }
  .panel-stat-row .n{ font-size:21px; font-weight:800; color:var(--ink); }

  .panel-eval-item{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:30px 0; border-bottom:1px solid var(--line-soft); cursor:pointer;
    transition:opacity 0.15s ease;
  }
  .panel-eval-item:hover{ opacity:0.8; }
  .panel-eval-item:last-child{ border-bottom:none; }
  .panel-seal{
    width:84px; height:84px; border-radius:50%; border:2px solid;
    display:flex; align-items:center; justify-content:center; margin-bottom:16px;
  }
  .panel-seal.pass{ border-color:var(--ok); background:rgba(74,222,128,0.08); }
  .panel-seal.fail{ border-color:var(--bad); background:rgba(248,113,113,0.08); }
  .panel-seal .pct{ font-size:21px; font-weight:800; color:var(--ink); }
  .panel-eval-item .top-line{ font-size:16px; font-weight:700; color:var(--ink); margin-bottom:5px; }
  .panel-eval-item .sub-line{ font-size:13px; color:var(--slate); }

  body{ padding-right:88px; }
  .side-toolbar{
    position:fixed; top:0; right:0; bottom:0; width:60px;
    background:var(--surface); border-left:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center;
    padding-top:22px; gap:14px; z-index:10;
  }
  .side-toolbar button{
    width:40px; height:40px; border-radius:12px;
    background:transparent; border:1.5px solid var(--line); color:var(--slate);
    font-size:17px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; transition:border-color 0.15s ease, color 0.15s ease;
  }
  .side-toolbar button:hover{ border-color:rgba(34,211,238,0.45); color:var(--ink); }
</style>
</head>
<body>

<div class="doc">
  <button class="theme-toggle" id="themeToggle" title="Cambiar tema" type="button">🌙</button>
  <main id="main"></main>
</div>

<div class="side-toolbar">
  <button id="sideSearchBtn" title="Buscar">🔍</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="panel.js"></script>

</body>
</html>
